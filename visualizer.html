<script type="module">
import * as THREE from 'three';

// ══════════════════════════════════════════════════════════════════════════
//  NEURALIS TIME — audio-reactive raymarched fractal + GPGPU particle field
//
//  Pipeline, per frame:
//    1. audio    FFT -> log bands -> envelopes -> spectral-flux onset detector
//    2. sim      two ping-pong float targets (velocity, then position)
//    3. scene    fullscreen raymarch of an Apollonian gasket, HDR out,
//                ray distance packed into alpha so particles can be occluded
//    4. dust     262k additive points, depth-tested against the scene alpha
//    5. bloom    dual-Kawase down/up chain + a separate anamorphic streak
//    6. final    ACES, radial chromatic aberration, grain, vignette
// ══════════════════════════════════════════════════════════════════════════

const SIM = 512;                      // 512 x 512 = 262 144 particles
const PARTICLES = SIM * SIM;
const BLOOM_STEPS = 6;
const MARCH_STEPS = 88;
const FRACTAL_ITERS = 10;

// ─── DOM ───
const $ = id => document.getElementById(id);
const gate = $('gate'), gateSub = $('gateSub'), startBtn = $('startBtn'), pickBtn = $('pickBtn');
const progressFill = $('progressFill'), dropVeil = $('drop'), controls = $('controls');
const playBtn = $('playBtn'), volSlider = $('volSlider'), volLabel = $('volLabel');
const fileBtn = $('fileBtn'), fsBtn = $('fsBtn'), fileInput = $('fileInput');
const hudRight = $('hudRight'), statsEl = $('stats'), scrubFill = $('scrubFill');

// ══════════════════════════════════════════════════════════════════════════
//  SHADER LIBRARY
// ══════════════════════════════════════════════════════════════════════════
const QUAD_VERT = /* glsl */`
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// Dave Hoskins' hash family — no sin(), stable across drivers.
const HASH = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 hash32(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yzz) * p3.zyx); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x),
                 mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x),
                 mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z) * 2.0 - 1.0;
}
`;

// iq's cosine palette. Four vec3 controls give every gradient we need.
const PALETTE = /* glsl */`
uniform vec3 uPalA, uPalB, uPalC, uPalD;
vec3 palette(float t){ return uPalA + uPalB * cos(6.28318530718 * (uPalC * t + uPalD)); }
`;

// The flow field the dust rides. A vortex, a stack of orthogonal sine waves and
// one noise octave — divergent enough to braid the particles into filaments,
// cheap enough to run on a quarter-million of them every frame.
const FLOW = /* glsl */`
vec3 flow(vec3 p, float t){
  vec3 v = vec3(-p.z, p.x * 0.16, p.x) * 0.55;
  v += vec3(sin(p.y * 1.6 + t), sin(p.z * 1.25 - t * 0.8), sin(p.x * 1.45 + t * 0.6)) * 0.9;
  float n = vnoise(p * 0.7 + vec3(0.0, 0.0, t * 0.3));
  v += vec3(n, n * 0.7, -n) * 1.7;
  return v;
}
vec3 spawn(vec2 uv, float seed){
  vec3 r = hash32(uv + seed);
  float a = r.x * 6.28318530718;
  float z = r.y * 2.0 - 1.0;
  float s = sqrt(max(0.0, 1.0 - z * z));
  return vec3(s * cos(a), s * sin(a), z) * (6.5 + sqrt(r.z) * 8.0);
}
`;

const SIM_INIT_POS = HASH + FLOW + /* glsl */`
varying vec2 vUv;
void main(){ gl_FragColor = vec4(spawn(vUv, 0.0), hash12(vUv * 91.7)); }
`;

const SIM_INIT_VEL = /* glsl */`
varying vec2 vUv;
void main(){ gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); }
`;

const SIM_VEL = HASH + FLOW + /* glsl */`
varying vec2 vUv;
uniform sampler2D uPos, uVel;
uniform float uDt, uTime, uLevel, uKick, uBass;
void main(){
  vec3 p = texture2D(uPos, vUv).xyz;
  vec4 V = texture2D(uVel, vUv);
  vec3 v = V.xyz;

  v += flow(p * 0.45, uTime * 0.35) * (0.55 + uLevel * 1.7) * uDt;

  // Soft shell constraint keeps the cloud around the camera instead of
  // letting the flow field blow it apart over a nine-minute track.
  float r = max(length(p), 0.0001);
  v -= (p / r) * (r - 9.5) * 0.85 * uDt;

  // Kick drives an outward shove; the drag below pulls it back in.
  v += (p / r) * uKick * 7.5 * uDt;
  v.y += uBass * 0.6 * uDt;

  v *= exp(-1.15 * uDt);
  gl_FragColor = vec4(v, V.w);
}
`;

const SIM_POS = HASH + FLOW + /* glsl */`
varying vec2 vUv;
uniform sampler2D uPos, uVel;
uniform float uDt, uTime;
void main(){
  vec4 P = texture2D(uPos, vUv);
  vec3 v = texture2D(uVel, vUv).xyz;
  vec3 p = P.xyz + v * uDt;
  float life = P.w - uDt * (0.055 + hash12(vUv * 13.7) * 0.07);
  if (life <= 0.0) { p = spawn(vUv, floor(uTime * 7.0) * 0.137); life = 1.0; }
  gl_FragColor = vec4(p, life);
}
`;

// ─── Raymarched Mandelbox ─────────────────────────────────────────────────
//
//  The first cut of this used iq's Apollonian gasket. It renders beautifully
//  when you orbit it, but its distance estimate divides by an accumulated
//  scale that grows by ~9 orders of magnitude over 7 inversions; every ray
//  then reports a sub-epsilon distance on its first step and the whole frame
//  collapses to flat fog. The Mandelbox carries its derivative in p.w, so the
//  estimate stays honest no matter how deep the folds go — which is what makes
//  it the standard fractal to actually fly a camera through.
const SCENE_FRAG = HASH + PALETTE + /* glsl */`
varying vec2 vUv;
uniform vec2  uRes;
uniform float uTime, uBass, uMid, uHigh, uLevel;
uniform float uScale, uMinR, uClipR, uShock, uShockT, uWarp, uGlow;
uniform vec3  uCamPos, uCamFwd, uCamUp;

mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

float gTrap;

float mapScene(vec3 pos){
  pos.xz *= rot(uTime * 0.035 + uWarp * 0.12);
  pos.xy *= rot(uTime * 0.021);

  float s = uScale;
  float mr2 = uMinR;
  vec4 sv = vec4(s, s, s, abs(s)) / mr2;
  float c1 = abs(s - 1.0);
  float c2 = pow(abs(s), float(1 - ${FRACTAL_ITERS}));

  vec4 p = vec4(pos, 1.0);
  vec4 p0 = p;
  float trap = 1e10;

  for (int i = 0; i < ${FRACTAL_ITERS}; i++){
    p.xyz = clamp(p.xyz, -1.0, 1.0) * 2.0 - p.xyz;    // box fold
    float r2 = dot(p.xyz, p.xyz);
    trap = min(trap, r2);
    p *= clamp(max(mr2 / r2, mr2), 0.0, 1.0);         // sphere fold (w carries the derivative)
    p = p * sv + p0;
  }
  gTrap = trap;
  float d = (length(p.xyz) - c1) / p.w - c2;
  return max(d, length(pos) - uClipR);
}

vec3 calcNormal(vec3 p, float t){
  vec2 e = vec2(1.0, -1.0) * 0.5773 * 0.0006 * t;
  return normalize(e.xyy * mapScene(p + e.xyy) + e.yyx * mapScene(p + e.yyx)
                 + e.yxy * mapScene(p + e.yxy) + e.xxx * mapScene(p + e.xxx));
}

// Smooth deep-space gradient. Anything quantised out here (a hashed starfield,
// for instance) gets picked up by the anamorphic pass and smeared into streaks.
vec3 background(vec3 rd){
  float v = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
  return mix(vec3(0.004, 0.006, 0.014), vec3(0.010, 0.014, 0.030) + palette(0.58) * 0.014, v * v);
}

void main(){
  vec2 q = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

  vec3 ww = normalize(uCamFwd);
  vec3 uu = normalize(cross(ww, uCamUp));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(q.x * uu + q.y * vv + 1.732 * ww);   // 60 deg vertical FOV
  vec3 ro = uCamPos;

  float t = 0.02;
  float hitTrap = 0.0;
  float steps = 0.0;
  bool hit = false;
  vec3 glow = vec3(0.0);

  for (int i = 0; i < ${MARCH_STEPS}; i++){
    vec3 p = ro + rd * t;
    float d = mapScene(p);
    steps += 1.0;

    // Volumetric bleed, weighted by the step actually taken so the haze does
    // not depend on how many iterations the marcher happened to spend.
    float dd = max(d, 0.0);
    glow += palette(gTrap * 3.0 + uTime * 0.03) * (uGlow / (1.0 + dd * dd * 260.0)) * min(dd, 0.25);

    if (d < 0.00035 * t){ hit = true; hitTrap = gTrap; break; }
    t += d * 0.9;
    if (t > 26.0) break;
  }

  vec3 col;
  if (hit){
    vec3 p = ro + rd * t;
    vec3 n = calcNormal(p, t);
    vec3 base = palette(sqrt(hitTrap) * 1.9 + uTime * 0.03 + uBass * 0.16);
    base = mix(vec3(dot(base, vec3(0.299, 0.587, 0.114))), base, 1.18);   // push chroma before it clips

    vec3 key = normalize(vec3(0.6, 0.75, -0.35));
    vec3 fill = normalize(vec3(-0.7, 0.1, 0.6));
    float dif = clamp(dot(n, key), 0.0, 1.0);
    float fil = clamp(dot(n, fill), 0.0, 1.0);
    float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);
    float ao  = clamp(1.0 - steps / float(${MARCH_STEPS}) * 1.6, 0.0, 1.0);
    float spe = pow(clamp(dot(reflect(rd, n), key), 0.0, 1.0), 34.0);

    col  = base * (0.05 + 0.52 * dif) * (0.12 + 0.88 * ao * ao);
    col += base.zyx * fil * 0.38;
    col += base * rim * (0.30 + uHigh * 1.1);
    col += vec3(1.0, 0.96, 0.92) * spe * (0.30 + uMid * 0.75);
    col += base * exp(-13.0 * hitTrap) * (0.12 + uBass * 1.7);   // emissive cores
    col = mix(col, background(rd) * 0.5, 1.0 - exp(-0.055 * max(t - 5.0, 0.0)));
  } else {
    col = background(rd);
  }

  col += glow * (0.30 + uLevel * 0.55);

  // Kick shockwave: a shell radiating out of the core itself.
  float shellR = length(ro + rd * t);
  col += palette(0.35 + uTime * 0.05) * exp(-5.0 * abs(shellR - 3.0 - uShockT * 9.0)) * uShock * 2.2;

  gl_FragColor = vec4(col, hit ? t : 1.0e4);                  // alpha carries ray distance
}
`;

const DUST_VERT = HASH + PALETTE + /* glsl */`
attribute vec2 aRef;
uniform sampler2D uPos, uVel, uSceneDepth;
uniform float uSize, uHigh, uTime, uLevel;
varying vec3 vCol;
varying float vFade;
void main(){
  vec4 P = texture2D(uPos, aRef);
  vec3 v = texture2D(uVel, aRef).xyz;

  vec4 mv = modelViewMatrix * vec4(P.xyz, 1.0);
  gl_Position = projectionMatrix * mv;

  float dist = max(length(mv.xyz), 0.05);
  float speed = length(v);

  gl_PointSize = clamp(uSize * (0.55 + speed * 0.35) / dist, 0.5, 7.0);

  vCol = palette(hash12(aRef * 57.3) * 0.55 + speed * 0.10 + uTime * 0.02) * (0.30 + speed * 0.55 + uHigh * 0.5);

  // Fade in and out across the particle's life so respawns never pop.
  float life = smoothstep(0.0, 0.12, P.w) * smoothstep(1.0, 0.86, P.w);

  // Occlude against the raymarched lattice using the ray distance the scene
  // pass stashed in alpha. Reading that target while writing a different one
  // is legal; sampling and writing the same one would not be.
  vec2 ndc = gl_Position.xy / max(abs(gl_Position.w), 0.0001) * 0.5 + 0.5;
  float sceneDist = texture2D(uSceneDepth, clamp(ndc, 0.0, 1.0)).a;
  float vis = smoothstep(sceneDist + 0.12, sceneDist - 0.06, dist);

  vFade = life * vis * (0.07 + uLevel * 0.13) * smoothstep(30.0, 3.0, dist);
}
`;

const DUST_FRAG = /* glsl */`
varying vec3 vCol;
varying float vFade;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r2 = dot(d, d);
  if (r2 > 0.25) discard;
  float a = smoothstep(0.25, 0.0, r2);
  gl_FragColor = vec4(vCol * a * a, 1.0) * vFade;
}
`;

const COMBINE_FRAG = /* glsl */`
varying vec2 vUv;
uniform sampler2D uScene, uDust;
void main(){ gl_FragColor = vec4(texture2D(uScene, vUv).rgb + texture2D(uDust, vUv).rgb, 1.0); }
`;

const BRIGHT_FRAG = /* glsl */`
varying vec2 vUv;
uniform sampler2D uTex;
uniform float uThreshold, uKnee;
void main(){
  vec3 c = texture2D(uTex, vUv).rgb;
  float br = max(c.r, max(c.g, c.b));
  float soft = clamp(br - uThreshold + uKnee, 0.0, 2.0 * uKnee);
  soft = soft * soft / (4.0 * uKnee + 0.0001);
  gl_FragColor = vec4(c * max(soft, br - uThreshold) / max(br, 0.0001), 1.0);
}
`;

// Dual-Kawase: 4 taps down, 8-tap tent up. Wide, smooth, and far cheaper than
// a separable gaussian of the same reach.
const DOWN_FRAG = /* glsl */`
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
  vec2 h = uTexel;
  vec3 s = texture2D(uTex, vUv).rgb * 4.0;
  s += texture2D(uTex, vUv + h).rgb;
  s += texture2D(uTex, vUv - h).rgb;
  s += texture2D(uTex, vUv + vec2(h.x, -h.y)).rgb;
  s += texture2D(uTex, vUv - vec2(h.x, -h.y)).rgb;
  gl_FragColor = vec4(s / 8.0, 1.0);
}
`;

const UP_FRAG = /* glsl */`
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
  vec2 h = uTexel;
  vec3 s = texture2D(uTex, vUv + vec2(-h.x * 2.0, 0.0)).rgb;
  s += texture2D(uTex, vUv + vec2(-h.x, h.y)).rgb * 2.0;
  s += texture2D(uTex, vUv + vec2(0.0, h.y * 2.0)).rgb;
  s += texture2D(uTex, vUv + vec2(h.x, h.y)).rgb * 2.0;
  s += texture2D(uTex, vUv + vec2(h.x * 2.0, 0.0)).rgb;
  s += texture2D(uTex, vUv + vec2(h.x, -h.y)).rgb * 2.0;
  s += texture2D(uTex, vUv + vec2(0.0, -h.y * 2.0)).rgb;
  s += texture2D(uTex, vUv + vec2(-h.x, -h.y)).rgb * 2.0;
  gl_FragColor = vec4(s / 12.0, 1.0);
}
`;

// Horizontal-only blur on the bright pass — the anamorphic streak that makes
// highlights read as camera glass rather than a blur filter.
const STREAK_FRAG = /* glsl */`
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uDir;
void main(){
  vec3 s = vec3(0.0);
  float wsum = 0.0;
  for (int i = -12; i <= 12; i++){
    float fi = float(i);
    float w = exp(-fi * fi / 42.0);
    s += texture2D(uTex, vUv + vec2(fi * uTexel.x * uDir, 0.0)).rgb * w;
    wsum += w;
  }
  gl_FragColor = vec4(s / wsum, 1.0);
}
`;

const FINAL_FRAG = HASH + /* glsl */`
varying vec2 vUv;
uniform sampler2D uHdr, uBloom, uStreak;
uniform vec2 uRes;
uniform float uTime, uBloomAmt, uStreakAmt, uBeat, uLevel, uFadeIn;

vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main(){
  vec2 uv = vUv;
  vec2 d = uv - 0.5;
  float r2 = dot(d, d);

  // Radial chromatic aberration, widened briefly on every onset.
  float ca = (0.0011 + uBeat * 0.0075) * (0.25 + r2 * 2.6);
  vec3 col;
  col.r = texture2D(uHdr, uv + d * ca).r;
  col.g = texture2D(uHdr, uv).g;
  col.b = texture2D(uHdr, uv - d * ca).b;

  col += texture2D(uBloom, uv).rgb * uBloomAmt;
  col += texture2D(uStreak, uv).rgb * uStreakAmt * vec3(0.55, 0.75, 1.25);

  col *= 1.0 + uBeat * 0.35;
  col = aces(col * (1.0 + uLevel * 0.25));

  col *= smoothstep(1.35, 0.28, length(d) * 1.45);                        // vignette
  col += (hash12(gl_FragCoord.xy + fract(uTime) * 719.0) - 0.5) * 0.010;  // grain
  col = pow(max(col, 0.0), vec3(1.0 / 2.2));
  gl_FragColor = vec4(col * uFadeIn, 1.0);
}
`;

// ══════════════════════════════════════════════════════════════════════════
//  RENDERER
// ══════════════════════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance', stencil: false, depth: false });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // tone mapping and gamma are done by hand in FINAL_FRAG
renderer.autoClear = false;
document.body.prepend(renderer.domElement);

const gl = renderer.getContext();
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

const quadGeo = new THREE.PlaneGeometry(2, 2);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

class Pass {
  constructor(frag, uniforms) {
    this.uniforms = uniforms || {};
    this.material = new THREE.ShaderMaterial({
      uniforms: this.uniforms, vertexShader: QUAD_VERT, fragmentShader: frag,
      depthTest: false, depthWrite: false,
    });
    this.scene = new THREE.Scene();
    this.scene.add(new THREE.Mesh(quadGeo, this.material));
  }
  render(target) {
    renderer.setRenderTarget(target || null);
    renderer.clear(true, false, false);
    renderer.render(this.scene, quadCam);
  }
}

function makeRT(w, h, opts) {
  return new THREE.WebGLRenderTarget(Math.max(1, w | 0), Math.max(1, h | 0), Object.assign({
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false, stencilBuffer: false, generateMipmaps: false,
  }, opts || {}));
}

// ─── Simulation targets ───
const simOpts = { type: THREE.FloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter };
const posRT = [makeRT(SIM, SIM, simOpts), makeRT(SIM, SIM, simOpts)];
const velRT = [makeRT(SIM, SIM, simOpts), makeRT(SIM, SIM, simOpts)];
let simPing = 0;

const initPosPass = new Pass(SIM_INIT_POS, {});
const initVelPass = new Pass(SIM_INIT_VEL, {});
initPosPass.render(posRT[0]); initPosPass.render(posRT[1]);
initVelPass.render(velRT[0]); initVelPass.render(velRT[1]);

const velPass = new Pass(SIM_VEL, {
  uPos: { value: null }, uVel: { value: null },
  uDt: { value: 0 }, uTime: { value: 0 }, uLevel: { value: 0 }, uKick: { value: 0 }, uBass: { value: 0 },
});
const posPass = new Pass(SIM_POS, {
  uPos: { value: null }, uVel: { value: null }, uDt: { value: 0 }, uTime: { value: 0 },
});

// ─── Palette uniforms, shared by every pass that needs colour ───
const pal = {
  uPalA: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
  uPalB: { value: new THREE.Vector3(0.5, 0.5, 0.5) },
  uPalC: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
  uPalD: { value: new THREE.Vector3(0.35, 0.18, 0.62) },
};

// ─── Scene pass ───
const scenePass = new Pass(SCENE_FRAG, Object.assign({
  uRes: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 }, uBass: { value: 0 }, uMid: { value: 0 }, uHigh: { value: 0 }, uLevel: { value: 0 },
  uScale: { value: -2.78 }, uMinR: { value: 0.25 }, uClipR: { value: 4.6 }, uGlow: { value: 0.030 },
  uShock: { value: 0 }, uShockT: { value: 0 }, uWarp: { value: 0 },
  uCamPos: { value: new THREE.Vector3() },
  uCamFwd: { value: new THREE.Vector3(0, 0, 1) },
  uCamUp:  { value: new THREE.Vector3(0, 1, 0) },
}, pal));

// ─── Dust ───
const dustGeo = new THREE.BufferGeometry();
{
  const refs = new Float32Array(PARTICLES * 2);
  for (let i = 0; i < PARTICLES; i++) {
    refs[i * 2]     = ((i % SIM) + 0.5) / SIM;
    refs[i * 2 + 1] = (Math.floor(i / SIM) + 0.5) / SIM;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PARTICLES * 3), 3));
  dustGeo.setAttribute('aRef', new THREE.BufferAttribute(refs, 2));
  dustGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
}

const dustMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({
    uPos: { value: null }, uVel: { value: null }, uSceneDepth: { value: null },
    uSize: { value: 220 }, uHigh: { value: 0 }, uTime: { value: 0 }, uLevel: { value: 0 },
  }, pal),
  vertexShader: DUST_VERT, fragmentShader: DUST_FRAG,
  transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
dustPoints.frustumCulled = false;
const dustScene = new THREE.Scene();
dustScene.add(dustPoints);

// The dust shares world space with the fractal, so this camera tracks the real
// flight position. 60 deg matches the 1.732 focal length hard-coded in the
// raymarcher, which is what keeps the depth comparison honest.
const dustCam = new THREE.PerspectiveCamera(60, 1, 0.05, 100);

// ─── Post passes ───
const combinePass = new Pass(COMBINE_FRAG, { uScene: { value: null }, uDust: { value: null } });
const brightPass  = new Pass(BRIGHT_FRAG, { uTex: { value: null }, uThreshold: { value: 0.85 }, uKnee: { value: 0.22 } });
const downPass    = new Pass(DOWN_FRAG, { uTex: { value: null }, uTexel: { value: new THREE.Vector2() } });
const upPass      = new Pass(UP_FRAG,   { uTex: { value: null }, uTexel: { value: new THREE.Vector2() } });
const streakPass  = new Pass(STREAK_FRAG, { uTex: { value: null }, uTexel: { value: new THREE.Vector2() }, uDir: { value: 1 } });
const finalPass   = new Pass(FINAL_FRAG, {
  uHdr: { value: null }, uBloom: { value: null }, uStreak: { value: null },
  uRes: { value: new THREE.Vector2() }, uTime: { value: 0 },
  uBloomAmt: { value: 0.9 }, uStreakAmt: { value: 0.5 },
  uBeat: { value: 0 }, uLevel: { value: 0 }, uFadeIn: { value: 0 },
});

// ─── Sized targets ───
let rtScene = null, rtDust = null, rtHdr = null, rtBright = null, rtStreakA = null, rtStreakB = null;
let bloomChain = [];
let renderScale = 0.85;
let viewW = 1, viewH = 1;

function allocTargets() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = Math.max(2, Math.round(window.innerWidth * dpr * renderScale));
  viewH = Math.max(2, Math.round(window.innerHeight * dpr * renderScale));

  [rtScene, rtDust, rtHdr, rtBright, rtStreakA, rtStreakB].forEach(rt => rt && rt.dispose());
  bloomChain.forEach(rt => rt.dispose());

  rtScene = makeRT(viewW, viewH);
  rtDust  = makeRT(viewW, viewH);
  rtHdr   = makeRT(viewW, viewH);
  rtBright = makeRT(viewW >> 1, viewH >> 1);
  rtStreakA = makeRT(viewW >> 2, viewH >> 2);
  rtStreakB = makeRT(viewW >> 2, viewH >> 2);

  bloomChain = [];
  let w = viewW >> 1, h = viewH >> 1;
  for (let i = 0; i < BLOOM_STEPS; i++) {
    w = Math.max(2, w >> 1); h = Math.max(2, h >> 1);
    bloomChain.push(makeRT(w, h));
  }

  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setPixelRatio(dpr);
  scenePass.uniforms.uRes.value.set(viewW, viewH);
  finalPass.uniforms.uRes.value.set(viewW, viewH);
  dustCam.aspect = window.innerWidth / window.innerHeight;
  dustCam.updateProjectionMatrix();
}
allocTargets();
window.addEventListener('resize', allocTargets);

// ══════════════════════════════════════════════════════════════════════════
//  AUDIO ENGINE
// ══════════════════════════════════════════════════════════════════════════
const FFT = 4096;

const AUDIO = {
  ctx: null, analyser: null, gain: null, source: null, buffer: null,
  freq: null, wave: null, bins: 0, bands: null,
  playing: false, started: false, volume: 0.75, name: '', startedAt: 0, offset: 0,
};

const ENV = { bass: 0, mid: 0, high: 0, level: 0, rms: 0 };

// Spectral-flux onset detection with an adaptive threshold. A fixed threshold
// either misses the quiet passages or machine-guns through the loud ones; the
// running mean plus a multiple of the deviation tracks the mix instead.
const ONSET = {
  prev: null,
  histKick: [], histHat: [],
  lastKick: -1, lastHat: -1,
  kick: 0, hat: 0, beat: 0,
  bpm: 0, intervals: [],
};

function ensureContext() {
  if (AUDIO.ctx) return AUDIO.ctx;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const gain = ctx.createGain();
  gain.gain.value = AUDIO.volume;
  const analyser = ctx.createAnalyser();
  analyser.fftSize = FFT;
  analyser.smoothingTimeConstant = 0.6;
  // Analyser sits ahead of the gain: the picture follows the track, not the
  // listening volume.
  analyser.connect(gain);
  gain.connect(ctx.destination);

  AUDIO.ctx = ctx; AUDIO.gain = gain; AUDIO.analyser = analyser;
  AUDIO.bins = analyser.frequencyBinCount;
  AUDIO.freq = new Uint8Array(AUDIO.bins);
  AUDIO.wave = new Uint8Array(AUDIO.bins);
  ONSET.prev = new Float32Array(AUDIO.bins);

  const binHz = ctx.sampleRate / FFT;
  const idx = hz => Math.max(0, Math.min(AUDIO.bins - 1, Math.round(hz / binHz)));
  AUDIO.bands = {
    sub:  [idx(20),   idx(80)],
    bass: [idx(30),   idx(240)],
    mid:  [idx(240),  idx(2200)],
    high: [idx(2000), idx(9000)],
    kick: [idx(35),   idx(160)],
    hat:  [idx(4500), idx(13000)],
    full: [idx(30),   idx(8000)],
  };
  return ctx;
}

function bandAvg(data, range) {
  let s = 0;
  for (let i = range[0]; i < range[1]; i++) s += data[i];
  return range[1] > range[0] ? s / (range[1] - range[0]) / 255 : 0;
}

function flux(data, range, prev) {
  let f = 0;
  for (let i = range[0]; i < range[1]; i++) {
    const v = data[i] / 255;
    const d = v - prev[i];
    if (d > 0) f += d;
    prev[i] = v;
  }
  return f / Math.max(1, range[1] - range[0]);
}

function adaptive(hist, value, mult, floor) {
  hist.push(value);
  if (hist.length > 43) hist.shift();          // ~0.7 s of history at 60 fps
  let m = 0;
  for (const v of hist) m += v;
  m /= hist.length;
  let s = 0;
  for (const v of hist) s += (v - m) * (v - m);
  s = Math.sqrt(s / hist.length);
  return value > m + mult * s && value > floor;
}

const PEAK = { bass: 0.18, mid: 0.18, high: 0.10, level: 0.15 };
function normBand(name, v, dt) {
  PEAK[name] = Math.max(v, PEAK[name] * Math.exp(-0.03 * dt));   // ~23 s half-life
  return Math.min(1, v / Math.max(PEAK[name], 0.02));
}

function follow(cur, target, attack, release, dt) {
  const rate = target > cur ? attack : release;
  return cur + (target - cur) * (1 - Math.exp(-rate * dt));
}

let envOverride = null;   // set by __neuralis.fake() for offscreen checks

function analyse(dt, now) {
  if (envOverride) { Object.assign(ENV, envOverride.env); ONSET.beat = envOverride.beat; ONSET.kick = envOverride.beat; return; }
  if (!AUDIO.analyser || !AUDIO.playing) {
    ENV.bass  = follow(ENV.bass,  0.20 + Math.sin(now * 0.9) * 0.09, 3, 3, dt);
    ENV.mid   = follow(ENV.mid,   0.16 + Math.sin(now * 0.6) * 0.07, 3, 3, dt);
    ENV.high  = follow(ENV.high,  0.12 + Math.sin(now * 1.4) * 0.05, 3, 3, dt);
    ENV.level = follow(ENV.level, 0.16, 3, 3, dt);
    ENV.rms   = follow(ENV.rms,   0.10, 3, 3, dt);
    ONSET.kick = follow(ONSET.kick, 0, 20, 4, dt);
    ONSET.hat  = follow(ONSET.hat, 0, 20, 6, dt);
    ONSET.beat = Math.max(ONSET.kick, ONSET.hat * 0.6);
    return;
  }

  const { analyser, freq, wave, bins, bands } = AUDIO;
  analyser.getByteFrequencyData(freq);
  analyser.getByteTimeDomainData(wave);

  const level = bandAvg(freq, bands.full);

  let sq = 0;
  for (let i = 0; i < bins; i++) { const v = (wave[i] - 128) / 128; sq += v * v; }
  const rms = Math.sqrt(sq / bins);

  ENV.bass  = follow(ENV.bass,  normBand('bass',  bandAvg(freq, bands.bass), dt), 30, 7, dt);
  ENV.mid   = follow(ENV.mid,   normBand('mid',   bandAvg(freq, bands.mid),  dt), 26, 8, dt);
  ENV.high  = follow(ENV.high,  normBand('high',  bandAvg(freq, bands.high), dt), 34, 11, dt);
  ENV.level = follow(ENV.level, normBand('level', level, dt), 22, 6, dt);
  ENV.rms   = follow(ENV.rms,   rms, 28, 9, dt);

  const fk = flux(freq, bands.kick, ONSET.prev);
  const fh = flux(freq, bands.hat, ONSET.prev);

  if (adaptive(ONSET.histKick, fk, 1.7, 0.006) && now - ONSET.lastKick > 0.14) {
    if (ONSET.lastKick > 0) {
      const iv = now - ONSET.lastKick;
      if (iv > 0.25 && iv < 1.4) {
        ONSET.intervals.push(iv);
        if (ONSET.intervals.length > 16) ONSET.intervals.shift();
        const sorted = ONSET.intervals.slice().sort((a, b) => a - b);
        ONSET.bpm = 60 / sorted[sorted.length >> 1];
      }
    }
    ONSET.lastKick = now;
    ONSET.kick = 1;
    director.onKick();
  }
  if (adaptive(ONSET.histHat, fh, 2.0, 0.004) && now - ONSET.lastHat > 0.08) {
    ONSET.lastHat = now;
    ONSET.hat = 1;
  }

  ONSET.kick = follow(ONSET.kick, 0, 40, 5.5, dt);
  ONSET.hat  = follow(ONSET.hat, 0, 40, 9, dt);
  ONSET.beat = Math.max(ONSET.kick, ONSET.hat * 0.55);
}

// ══════════════════════════════════════════════════════════════════════════
//  DIRECTOR — turns the analysis into staging decisions
// ══════════════════════════════════════════════════════════════════════════
const PALETTES = [
  { a: [0.32, 0.29, 0.44], b: [0.34, 0.28, 0.42], c: [1.00, 1.00, 1.00], d: [0.55, 0.63, 0.78] },  // nebula violet
  { a: [0.40, 0.28, 0.20], b: [0.40, 0.29, 0.18], c: [1.00, 0.95, 0.85], d: [0.02, 0.14, 0.26] },  // ember
  { a: [0.29, 0.37, 0.46], b: [0.29, 0.33, 0.39], c: [1.00, 1.00, 1.05], d: [0.62, 0.70, 0.82] },  // glacier
  { a: [0.42, 0.26, 0.38], b: [0.39, 0.24, 0.35], c: [1.00, 1.00, 1.00], d: [0.88, 0.10, 0.48] },  // magenta noir
  { a: [0.33, 0.35, 0.33], b: [0.35, 0.31, 0.25], c: [1.00, 0.90, 0.70], d: [0.15, 0.35, 0.62] },  // gold / teal
];

const director = {
  fly: 0, speed: 0.3, roll: 0, warp: 0, radius: 15.2,
  paletteIdx: 0,
  cur: { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), d: new THREE.Vector3() },
  tgt: { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), d: new THREE.Vector3() },
  shock: 0, shockT: 9,
  kicksSincePalette: 0,
  longEnergy: 0, sectionCooldown: 0,
  camDrift: new THREE.Vector2(),

  init() {
    this.applyPalette(0, true);
  },
  applyPalette(i, instant) {
    const p = PALETTES[i % PALETTES.length];
    this.paletteIdx = i % PALETTES.length;
    this.tgt.a.fromArray(p.a); this.tgt.b.fromArray(p.b);
    this.tgt.c.fromArray(p.c); this.tgt.d.fromArray(p.d);
    if (instant) {
      this.cur.a.copy(this.tgt.a); this.cur.b.copy(this.tgt.b);
      this.cur.c.copy(this.tgt.c); this.cur.d.copy(this.tgt.d);
    }
  },
  onKick() {
    this.shock = 1; this.shockT = 0;
    this.kicksSincePalette++;
    // Roughly every 8 bars, and only when the track has some weight behind it.
    if (this.kicksSincePalette > 32 && ENV.level > 0.16) {
      this.kicksSincePalette = 0;
      this.applyPalette(this.paletteIdx + 1 + (Math.random() < 0.35 ? 1 : 0), false);
      this.warp += 1;
    }
  },
  update(dt) {
    // Structural change: a sustained jump in energy re-stages the scene.
    const target = ENV.level;
    this.longEnergy += (target - this.longEnergy) * (1 - Math.exp(-0.35 * dt));
    this.sectionCooldown = Math.max(0, this.sectionCooldown - dt);
    if (this.sectionCooldown === 0 && Math.abs(target - this.longEnergy) > 0.085) {
      this.sectionCooldown = 6;
      this.applyPalette(this.paletteIdx + 1, false);
      this.warp += 1.5;
    }

    const k = 1 - Math.exp(-1.6 * dt);
    this.cur.a.lerp(this.tgt.a, k); this.cur.b.lerp(this.tgt.b, k);
    this.cur.c.lerp(this.tgt.c, k); this.cur.d.lerp(this.tgt.d, k);

    this.speed = 0.22 + ENV.level * 1.15 + ENV.bass * 0.5;
    this.fly += this.speed * dt;

    // Bass pulls the camera in; the slow sine keeps it from settling.
    const wantR = 15.2 - ENV.bass * 2.6 - ENV.level * 1.3 + Math.sin(this.fly * 0.055) * 2.2;
    this.radius += (wantR - this.radius) * (1 - Math.exp(-1.4 * dt));
    this.roll += dt * (0.06 + ENV.high * 0.32);
    this.shockT += dt;
    this.shock *= Math.exp(-1.5 * dt);

    this.camDrift.x = Math.sin(this.fly * 0.31) * 0.42 + Math.sin(this.fly * 0.11) * 0.22;
    this.camDrift.y = Math.cos(this.fly * 0.24) * 0.38 + Math.cos(this.fly * 0.09) * 0.18;
  },
};
director.init();

function gateDrop() {
  gateSub.classList.remove('err');
  gateSub.innerHTML = 'No soundtrack is embedded in this build.<br>Drop an audio file anywhere on the window, or pick one below.';
  startBtn.style.display = 'none'; pickBtn.style.display = '';
  setProgress(0);
}
function gateError(err, ctxName) {
  gateSub.classList.add('err');
  gateSub.textContent = (ctxName ? ctxName + ': ' : '') + (err && err.message ? err.message : String(err));
  startBtn.style.display = 'none'; pickBtn.style.display = '';
  setProgress(0);
  console.error('[neuralis]', err);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function readEmbedded() {
  const el = $('audioData');
  if (!el) return null;
  const raw = el.textContent.trim();
  if (!raw || raw[0] === '_') return null;         // untouched placeholder
  const res = await fetch(`data:${el.dataset.mime || 'audio/webm'};base64,${raw}`);
  if (!res.ok) throw new Error('embedded audio could not be read');
  return { bytes: await res.arrayBuffer(), name: el.dataset.name || 'Embedded track' };
}

async function play(bytes, name) {
  const ctx = ensureContext();
  setProgress(0.5);
  const buffer = await ctx.decodeAudioData(bytes);
  setProgress(0.85);

  if (AUDIO.source) { try { AUDIO.source.stop(); } catch (_) {} AUDIO.source.disconnect(); }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  src.loop = true;
  src.connect(AUDIO.analyser);
  src.start(0);

  AUDIO.source = src; AUDIO.buffer = buffer; AUDIO.name = name || '';
  AUDIO.startedAt = ctx.currentTime;
  await ctx.resume();
  AUDIO.playing = ctx.state === 'running';
  AUDIO.started = true;

  setProgress(1);
  gate.classList.add('hidden');
  controls.classList.add('visible');
  syncUI();
}

async function startEmbedded() {
  try {
    gateBusy('Decoding…');
    setProgress(0.2);
    const e = await readEmbedded();
    if (!e) { gateDrop(); return; }
    await play(e.bytes, e.name);
  } catch (err) { gateError(err); }
}

async function startFile(file) {
  if (!file) return;
  try {
    gateBusy('Reading ' + file.name + '…');
    setProgress(0.2);
    await play(await file.arrayBuffer(), file.name);
  } catch (err) { gateError(err, file.name); }
}

async function toggle() {
  if (!AUDIO.started) return;
  if (AUDIO.ctx.state === 'running') await AUDIO.ctx.suspend();
  else await AUDIO.ctx.resume();
  AUDIO.playing = AUDIO.ctx.state === 'running';
  syncUI();
}

function syncUI() {
  playBtn.textContent = AUDIO.playing ? '⏸' : '▶';
  hudRight.innerHTML = AUDIO.name
    ? `<b>${esc(AUDIO.name)}</b><br>${AUDIO.playing ? 'playing' : 'paused'}`
    : 'awaiting audio';
}

startBtn.addEventListener('click', startEmbedded);
playBtn.addEventListener('click', toggle);
pickBtn.addEventListener('click', () => fileInput.click());
fileBtn.addEventListener('click', () => fileInput.click());
fsBtn.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
fileInput.addEventListener('change', e => { startFile(e.target.files[0]); fileInput.value = ''; });

volSlider.addEventListener('input', () => {
  AUDIO.volume = parseFloat(volSlider.value);
  volLabel.textContent = Math.round(AUDIO.volume * 100);
  if (AUDIO.gain) AUDIO.gain.gain.value = AUDIO.volume;
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (AUDIO.started) toggle();
    else if (startBtn.style.display !== 'none') startEmbedded();
  } else if (e.key === 'f' || e.key === 'F') {
    fsBtn.click();
  } else if (e.key === 'i' || e.key === 'I') {
    statsEl.classList.toggle('on');
  } else if (e.key === 'h' || e.key === 'H') {
    document.body.classList.toggle('immersive');
  }
});

let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) dropVeil.classList.add('on'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropVeil.classList.remove('on'); } });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; dropVeil.classList.remove('on');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) startFile(f);
});

// Chrome fades out when the mouse rests, so the piece can be watched clean.
let idleTimer = null;
function pokeChrome() {
  document.body.classList.remove('immersive');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (AUDIO.started) document.body.classList.add('immersive'); }, 3200);
}
window.addEventListener('mousemove', pokeChrome);
window.addEventListener('mousedown', pokeChrome);
pokeChrome();

// ══════════════════════════════════════════════════════════════════════════
//  FRAME
// ══════════════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
const camPos = new THREE.Vector3();
const camFwd = new THREE.Vector3();
const camUp  = new THREE.Vector3();
const camQuat = new THREE.Quaternion();
const camMat = new THREE.Matrix4();
const camLookTarget = new THREE.Vector3();
let fadeIn = 0, simTime = 0;
let frameAvg = 16.7, scaleCooldown = 2;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  frameAvg += (dt * 1000 - frameAvg) * 0.06;
  renderFrame(dt);
}

// Split out from the rAF wrapper so the pipeline can also be stepped by hand
// with a fixed timestep — handy for offscreen capture and deterministic checks.
function renderFrame(dt) {
  frameCount++;
  simTime += dt;

  const now = simTime;

  analyse(dt, now);
  director.update(dt);

  fadeIn = (AUDIO.started || envOverride) ? Math.min(1, fadeIn + dt * 0.55) : Math.min(0.35, fadeIn + dt * 0.25);

  // ─── 1. simulate ───
  const src = simPing, dst = 1 - simPing;
  velPass.uniforms.uPos.value = posRT[src].texture;
  velPass.uniforms.uVel.value = velRT[src].texture;
  velPass.uniforms.uDt.value = dt;
  velPass.uniforms.uTime.value = now;
  velPass.uniforms.uLevel.value = ENV.level;
  velPass.uniforms.uKick.value = ONSET.kick;
  velPass.uniforms.uBass.value = ENV.bass;
  velPass.render(velRT[dst]);

  posPass.uniforms.uPos.value = posRT[src].texture;
  posPass.uniforms.uVel.value = velRT[dst].texture;
  posPass.uniforms.uDt.value = dt;
  posPass.uniforms.uTime.value = now;
  posPass.render(posRT[dst]);
  simPing = dst;

  // ─── 2. camera ───
  // The Mandelbox is a bounded body, so the camera orbits it rather than
  // tunnelling forever: azimuth from the travelled distance, radius pulled in
  // by the low end, aim offset slightly off-centre so the framing keeps moving.
  const fly = director.fly;
  const radius = director.radius;
  const el = Math.sin(fly * 0.13) * 0.55 + Math.sin(fly * 0.047) * 0.35;
  camPos.set(
    Math.sin(fly * 0.21) * Math.cos(el) * radius,
    Math.sin(el) * radius * 0.75,
    Math.cos(fly * 0.21) * Math.cos(el) * radius
  );
  camFwd.copy(camPos).multiplyScalar(-1).normalize();
  camFwd.x += Math.sin(fly * 0.11) * 0.05;
  camFwd.y += Math.cos(fly * 0.09) * 0.04;
  camFwd.normalize();
  camUp.set(Math.sin(director.roll) * 0.55, Math.cos(director.roll), 0).normalize();

  const su = scenePass.uniforms;
  su.uTime.value = now;
  su.uBass.value = ENV.bass; su.uMid.value = ENV.mid; su.uHigh.value = ENV.high; su.uLevel.value = ENV.level;
  su.uScale.value = -2.62 - ENV.bass * 0.26 - Math.sin(now * 0.07) * 0.16;
  su.uMinR.value = 0.24 + ENV.mid * 0.05 + Math.sin(now * 0.043) * 0.025;
  su.uClipR.value = 4.35 + ENV.bass * 0.85 + ONSET.beat * 0.35 + Math.sin(now * 0.06) * 0.30;
  su.uShock.value = director.shock;
  su.uShockT.value = director.shockT;
  su.uWarp.value = director.warp;
  su.uCamPos.value.copy(camPos);
  su.uCamFwd.value.copy(camFwd);
  su.uCamUp.value.copy(camUp);
  su.uPalA.value.copy(director.cur.a); su.uPalB.value.copy(director.cur.b);
  su.uPalC.value.copy(director.cur.c); su.uPalD.value.copy(director.cur.d);
  scenePass.render(rtScene);

  // ─── 3. dust ───
  camLookTarget.copy(camPos).add(camFwd);
  camMat.lookAt(camPos, camLookTarget, camUp);
  camQuat.setFromRotationMatrix(camMat);
  dustCam.position.copy(camPos);
  dustCam.quaternion.copy(camQuat);
  dustCam.updateMatrixWorld(true);

  const du = dustMat.uniforms;
  du.uPos.value = posRT[simPing].texture;
  du.uVel.value = velRT[simPing].texture;
  du.uSceneDepth.value = rtScene.texture;
  du.uSize.value = 13 * (viewH / 1080) * (1 + ENV.bass * 0.25);
  du.uHigh.value = ENV.high;
  du.uLevel.value = ENV.level;
  du.uTime.value = now;
  du.uPalA.value.copy(director.cur.a); du.uPalB.value.copy(director.cur.b);
  du.uPalC.value.copy(director.cur.c); du.uPalD.value.copy(director.cur.d);

  renderer.setRenderTarget(rtDust);
  renderer.clear(true, false, false);
  renderer.render(dustScene, dustCam);

  // ─── 4. combine + bloom ───
  combinePass.uniforms.uScene.value = rtScene.texture;
  combinePass.uniforms.uDust.value = rtDust.texture;
  combinePass.render(rtHdr);

  brightPass.uniforms.uTex.value = rtHdr.texture;
  brightPass.uniforms.uThreshold.value = 0.70;
  brightPass.render(rtBright);

  let prev = rtBright;
  for (let i = 0; i < bloomChain.length; i++) {
    downPass.uniforms.uTex.value = prev.texture;
    downPass.uniforms.uTexel.value.set(1 / prev.width, 1 / prev.height);
    downPass.render(bloomChain[i]);
    prev = bloomChain[i];
  }
  for (let i = bloomChain.length - 2; i >= 0; i--) {
    upPass.uniforms.uTex.value = prev.texture;
    upPass.uniforms.uTexel.value.set(1 / prev.width, 1 / prev.height);
    // Additive accumulation on the way back up is what widens the falloff.
    upPass.material.blending = THREE.AdditiveBlending;
    renderer.setRenderTarget(bloomChain[i]);
    renderer.render(upPass.scene, quadCam);
    prev = bloomChain[i];
  }
  upPass.material.blending = THREE.NormalBlending;

  // anamorphic streak: two horizontal passes at quarter res
  streakPass.uniforms.uTex.value = rtBright.texture;
  streakPass.uniforms.uTexel.value.set(1 / rtStreakA.width, 1 / rtStreakA.height);
  streakPass.uniforms.uDir.value = 1;
  streakPass.render(rtStreakA);
  streakPass.uniforms.uTex.value = rtStreakA.texture;
  streakPass.uniforms.uDir.value = 3;
  streakPass.render(rtStreakB);

  // ─── 5. final ───
  const fu = finalPass.uniforms;
  fu.uHdr.value = rtHdr.texture;
  fu.uBloom.value = prev.texture;
  fu.uStreak.value = rtStreakB.texture;
  fu.uTime.value = now;
  fu.uBloomAmt.value = 0.42 + ENV.level * 0.22 + ONSET.beat * 0.30;
  fu.uStreakAmt.value = 0.10 + ENV.high * 0.25;
  fu.uBeat.value = ONSET.beat;
  fu.uLevel.value = ENV.level;
  fu.uFadeIn.value = fadeIn;
  finalPass.render(null);

  // ─── adaptive resolution ───
  // 17.5 ms means we are landing on vsync at 60 Hz and have headroom to spare;
  // past 22 ms we are dropping frames and should trade pixels for pace.
  scaleCooldown -= dt;
  if (scaleCooldown <= 0) {
    let next = renderScale;
    if (frameAvg > 22 && renderScale > 0.5) next = Math.max(0.5, renderScale - 0.1);
    else if (frameAvg < 17.5 && renderScale < 1.0) next = Math.min(1.0, renderScale + 0.1);
    if (next !== renderScale) { renderScale = next; allocTargets(); }
    scaleCooldown = 1.5;
  }

  if (statsEl.classList.contains('on')) {
    statsEl.innerHTML =
      `frame <span>${frameAvg.toFixed(1)} ms</span> (<span>${(1000 / Math.max(frameAvg, 0.01)).toFixed(0)} fps</span>) · scale <span>${renderScale.toFixed(2)}</span> · <span>${viewW}×${viewH}</span><br>` +
      `dust <span>${PARTICLES.toLocaleString('en')}</span> · march <span>${MARCH_STEPS}</span> · iter <span>${FRACTAL_ITERS}</span><br>` +
      `bass <span>${ENV.bass.toFixed(2)}</span> mid <span>${ENV.mid.toFixed(2)}</span> high <span>${ENV.high.toFixed(2)}</span><br>` +
      `bpm <span>${ONSET.bpm ? ONSET.bpm.toFixed(0) : '—'}</span> · palette <span>${director.paletteIdx}</span>`;
  }

  if (AUDIO.buffer && AUDIO.playing) {
    const pos = (AUDIO.ctx.currentTime - AUDIO.startedAt) % AUDIO.buffer.duration;
    scrubFill.style.width = (pos / AUDIO.buffer.duration * 100) + '%';
  }
}

// Small diagnostic handle — lets the console (or an automated check) confirm the
// pipeline is actually stepping without digging through module scope.
let frameCount = 0;
window.__neuralis = {
  get info() {
    return {
      frames: frameCount,
      glError: renderer.getContext().getError(),
      programs: renderer.info.programs ? renderer.info.programs.length : -1,
      drawCalls: renderer.info.render.calls,
      points: renderer.info.render.points,
      renderScale, viewW, viewH,
      frameMs: +frameAvg.toFixed(2),
      env: { ...ENV }, beat: +ONSET.beat.toFixed(3), bpm: Math.round(ONSET.bpm),
      audio: { started: AUDIO.started, playing: AUDIO.playing, name: AUDIO.name },
      palette: director.paletteIdx,
    };
  },
  // Step the pipeline by hand and read the framebuffer back. Works even when the
  // page is not compositing (rAF parked), which is exactly when a screenshot
  // cannot help. readPixels is taken in the same task as the draw, so no
  // preserveDrawingBuffer — and therefore no cost — in normal playback.
  probe(frames, outWidth) {
    frames = frames || 30; outWidth = outWidth || 560;
    for (let i = 0; i < frames; i++) renderFrame(1 / 60);

    const g = renderer.getContext();
    const W = g.drawingBufferWidth, H = g.drawingBufferHeight;
    const px = new Uint8Array(W * H * 4);
    g.readPixels(0, 0, W, H, g.RGBA, g.UNSIGNED_BYTE, px);

    const full = document.createElement('canvas');
    full.width = W; full.height = H;
    const fctx = full.getContext('2d');
    const img = fctx.createImageData(W, H);
    for (let y = 0; y < H; y++) {                     // readPixels is bottom-up
      const s = (H - 1 - y) * W * 4;
      img.data.set(px.subarray(s, s + W * 4), y * W * 4);
    }
    fctx.putImageData(img, 0, 0);

    const out = document.createElement('canvas');
    out.width = outWidth; out.height = Math.max(1, Math.round(H * outWidth / W));
    out.getContext('2d').drawImage(full, 0, 0, out.width, out.height);
    return out.toDataURL('image/jpeg', 0.72);
  },
  get u() { return scenePass.uniforms; },
  get dustU() { return dustMat.uniforms; },
  get finalU() { return finalPass.uniforms; },
  get dir() { return director; },
  // Feed synthetic audio levels so the reactive paths can be exercised without
  // a decoded track (used by the offscreen checks).
  fake(bass, mid, high, level, beat) {
    envOverride = bass === null ? null
      : { env: { bass, mid, high, level, rms: level }, beat: beat || 0 };
  },
};

// ══════════════════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════════════════
(function boot() {
  const el = $('audioData');
  const raw = el ? el.textContent.trim() : '';
  if (raw && raw[0] !== '_') {
    gateReady(`${el.dataset.name || 'Embedded track'} · ${(raw.length * 0.75 / 1048576).toFixed(1)} MB`);
  } else {
    gateDrop();
  }
  syncUI();
  frame();
})();
</script>
</body>
</html>
